
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peluditos Pet - Gestión de Clientes</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>🐾 Peluditos Pet - Gestión de Clientes</h1>
    </header>

    <main>

        <div class="actions">
            <button type="button" id="btn-nuevo-lead">
                + Registrar Nuevo Lead
            </button>

            <button type="button" id="btn-nueva-campana">Generar Campaña</button>
            <button type="button" id="btn-refrescar">
                ↻ Actualizar Tareas
            </button>
        </div>

        <div id="lista-tareas">
            <p class="loading">
                Cargando tareas pendientes...
            </p>
        </div>

    </main>

    <!-- FORMULARIO DE REGISTRO DE LEADS -->

    <div id="modal-formulario" class="modal oculto">

        <div class="modal-contenido">

            <button type="button" class="cerrar"
                    aria-label="Cerrar formulario">
                &times;
            </button>

            <h2>Registrar Nuevo Lead</h2>

            <form id="form-lead">

                <label for="nombreCliente">
                    Nombre del Cliente:
                </label>
                <input
                    type="text"
                    id="nombreCliente"
                    maxlength="120"
                    required
                >

                <label for="nombreMascota">
                    Nombre de la Mascota:
                </label>
                <input
                    type="text"
                    id="nombreMascota"
                    maxlength="100"
                    required
                >

                <label for="canalOrigen">
                    Canal de Origen:
                </label>
                <select id="canalOrigen">
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                    <option value="TikTok">TikTok</option>
                </select>

                <label for="fechaCumple">
                    Fecha de Cumpleaños de la Mascota:
                </label>
                <input
                    type="date"
                    id="fechaCumple"
                    required
                >

                <label for="quiereComprar">
                    ¿Desea comprar?
                </label>
                <select id="quiereComprar">
                    <option value="true">
                        Sí, desea comprar
                    </option>
                    <option value="false">
                        No, solo está consultando
                    </option>
                </select>

                <button type="button" id="btn-guardar">
                    Guardar y Avanzar
                </button>

            </form>

        </div>

    </div>

    <!-- CONFIGURACION Y LOGICA DEL FRONTEND -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
