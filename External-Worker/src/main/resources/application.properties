
spring.application.name=worker

# Conexion a Flowable OSS
flowable.external.worker.rest.base-url=${FLOWABLE_REST_URL:http://localhost:8080/flowable-rest}

# Intervalo de consulta
flowable.external.worker.polling-interval=10s

# Credenciales mediante variables de entorno
flowable.external.worker.rest.authentication.basic.username=${FLOWABLE_ADMIN_USER:rest-admin}
flowable.external.worker.rest.authentication.basic.password=${FLOWABLE_ADMIN_PASSWORD}

# Puerto del Worker
server.port=${WORKER_PORT:8081}
