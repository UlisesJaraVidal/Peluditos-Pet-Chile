
# Peluditos Pet Chile - Evaluacion 3

spring.application.name=webservice
spring.jersey.type=filter

# Puerto configurable del Backend
server.port=${SERVER_PORT:8082}

# Conexion PostgreSQL configurable
spring.datasource.url=${PELUDITOS_DB_URL:jdbc:postgresql://localhost:5432/peluditos_db}
spring.datasource.username=${PELUDITOS_DB_USER:flowable}
spring.datasource.password=${PELUDITOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
