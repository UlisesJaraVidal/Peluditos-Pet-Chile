spring.application.name=worker

# URL base solo hasta /flowable-rest (sin /service)
flowable.external.worker.rest.base-url=http://localhost:8080/flowable-rest

flowable.external.worker.polling-interval=10s
flowable.external.worker.rest.authentication.basic.username=rest-admin
flowable.external.worker.rest.authentication.basic.password=test

# Mantener el puerto 8081 para evitar conflicto con el Web Service de Bastián
server.port=8081